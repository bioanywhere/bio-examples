<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bio starter — demo client</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0f;
        --panel: #14141c;
        --border: #2a2a38;
        --text: #e6e6f0;
        --muted: #8a8aa0;
        --accent: #00ffff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
        padding: 32px 16px;
      }
      main { max-width: 720px; margin: 0 auto; }
      h1 { margin: 0 0 4px; font-size: 22px; }
      h1 span { color: var(--accent); }
      p.muted { color: var(--muted); margin: 0 0 24px; }
      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      label { display: block; font-weight: 600; margin-bottom: 8px; }
      textarea {
        width: 100%;
        min-height: 90px;
        background: #0a0a0f;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px;
        font: inherit;
        resize: vertical;
      }
      button {
        margin-top: 8px;
        background: var(--accent);
        color: #0a0a0f;
        border: 0;
        border-radius: 4px;
        padding: 6px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: wait; }
      pre {
        margin-top: 12px;
        background: #0a0a0f;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 32px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span>bio</span> starter — demo client</h1>
      <p class="muted">
        Each box calls your registered agent through the marketplace.
        Make sure <code>BIO_AGENT_ID</code> is set in <code>.env</code>.
      </p>

      <section data-skill="summarize">
        <label>summarize</label>
        <textarea>Honeybees pollinate roughly a third of the food we eat, including apples, almonds, and blueberries. Colony collapse threatens this supply.</textarea>
        <button>Run</button>
        <pre></pre>
      </section>

      <section data-skill="extract-entities">
        <label>extract-entities</label>
        <textarea>Ada Lovelace co-founded BeeCorp in London in 2014 with help from Stanford University.</textarea>
        <button>Run</button>
        <pre></pre>
      </section>

      <section data-skill="qa">
        <label>qa</label>
        <textarea>Q: Who co-founded BeeCorp?
C: Ada Lovelace co-founded BeeCorp in London in 2014.</textarea>
        <button>Run</button>
        <pre></pre>
      </section>
    </main>
    <script>
      document.querySelectorAll("section").forEach((sec) => {
        const skill = sec.dataset.skill;
        const btn = sec.querySelector("button");
        const ta = sec.querySelector("textarea");
        const out = sec.querySelector("pre");
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          out.textContent = "running...";
          try {
            const r = await fetch("/api/run", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ skillId: skill, prompt: ta.value }),
            });
            const json = await r.json();
            out.textContent = r.ok
              ? `task ${json.taskId} (${json.state})\n\n${json.text}`
              : `ERROR: ${json.error || r.status}`;
          } catch (err) {
            out.textContent = `ERROR: ${err.message}`;
          } finally {
            btn.disabled = false;
          }
        });
      });
    </script>
  </body>
</html>
